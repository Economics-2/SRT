<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ভিডিও + ভয়েস ওভার + SRT রেন্ডারার</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;700&family=Hind+Siliguri:wght@400;700&family=Tiro+Bangla&family=Baloo+Da+2:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f8;--panel:#fff;--ink:#14162b;--mut:#62667f;--line:#d9dbe8;--acc:#3b3fe0;--accI:#fff;--stage:#0b0c18;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f1c;--panel:#171932;--ink:#eceefb;--mut:#9a9eb9;--line:#2b2e52;--acc:#8b8fff;--accI:#0e0f1c}}
:root[data-theme="dark"]{--bg:#0e0f1c;--panel:#171932;--ink:#eceefb;--mut:#9a9eb9;--line:#2b2e52;--acc:#8b8fff;--accI:#0e0f1c}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans Bengali",system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{margin:0 0 18px;color:var(--mut)}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:860px){.grid{grid-template-columns:1.5fr 1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.stage{background:var(--stage);border-radius:8px;overflow:hidden;display:flex;justify-content:center;align-items:center;min-height:180px}
canvas{max-width:100%;max-height:60vh;display:block}
.drop{display:block;border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;cursor:pointer}
.drop b{display:block;font-size:.95rem}
.drop span{color:var(--mut);font-size:.85rem;word-break:break-all}
.drop.ok{border-style:solid;border-color:var(--acc)}
.drop input{display:none}
.row{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:.9rem}
.row label{flex:0 0 112px;color:var(--mut)}
.row input[type=range]{flex:1;accent-color:var(--acc);min-width:0}
.row output{flex:0 0 46px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
.row input[type=number],.row select{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;min-width:0}
.row input[type=color]{width:40px;height:30px;border:1px solid var(--line);border-radius:6px;background:none;padding:0}
button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer}
button.pri{background:var(--acc);color:var(--accI);border-color:var(--acc);font-weight:700}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,.drop:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.bar{display:flex;gap:8px;margin-top:10px;align-items:center}
.bar input[type=range]{flex:1;accent-color:var(--acc)}
.t{font-variant-numeric:tabular-nums;color:var(--mut);font-size:.85rem}
.prog{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:12px;display:none}
.prog i{display:block;height:100%;width:0;background:var(--acc)}
#msg{margin:8px 0 0;color:var(--mut);font-size:.9rem}
#out{display:none;margin-top:14px}
#out video{width:100%;max-height:50vh;border-radius:8px;background:#000}
a.dl{display:inline-block;margin-top:10px;text-decoration:none}
h2{font-size:1.05rem;margin:0 0 10px}

html,body{height:100%;overflow:hidden}
body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
.app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
.top{flex:0 0 auto;padding:8px 14px;font-weight:700;display:flex;align-items:center;gap:8px}
.stage{flex:1 1 auto;min-height:120px;position:relative;border-radius:0}
.stage canvas{position:absolute;inset:0;margin:auto;max-width:100%;max-height:100%}
.bar{flex:0 0 auto;padding:8px 12px;margin:0;gap:8px}
.bar button{padding:8px 12px;min-width:64px}
.prog{flex:0 0 auto;margin:0 12px 4px}
#msg{flex:0 0 auto;margin:0;padding:2px 14px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.8rem}
.tabs{position:relative;flex:0 0 auto;display:flex;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line);background:var(--panel)}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:0 0 auto;border:0;border-radius:0;background:none;padding:11px 14px;color:var(--mut);font-size:.9rem;white-space:nowrap;transition:color .25s}
.tabs button.on{color:var(--acc);font-weight:700}
#ind{position:absolute;bottom:0;left:0;height:3px;width:0;background:var(--acc);border-radius:3px 3px 0 0;transition:left .35s cubic-bezier(.2,.8,.2,1),width .35s cubic-bezier(.2,.8,.2,1)}
.dock{flex:0 0 auto;height:min(46dvh,380px);overflow:hidden;background:var(--panel)}
.track{display:flex;height:100%;transition:transform .38s cubic-bezier(.22,.8,.25,1);will-change:transform}
.pane{flex:0 0 100%;min-width:0;height:100%;overflow-y:auto;overscroll-behavior:contain;padding:12px 14px 16px}
.row input[type=number],.row select,.row input[type=text]{min-height:36px}
#out{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.65);padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;overflow:auto;margin:0}
#out .card{background:var(--panel);border-radius:14px;padding:14px;max-width:520px;margin:0 auto}
@media (prefers-reduced-motion:reduce){.track,#ind{transition:none}}
</style>
</head>
<body>
<div class="app">
<header class="top">🎬 <span>SRT ভিডিও রেন্ডারার</span></header>
<div class="stage"><canvas id="cv" width="640" height="360"></canvas></div>
<div class="bar">
<button id="pp" disabled>প্লে</button>
<input type="range" id="seek" min="0" max="1000" value="0" disabled aria-label="টাইমলাইন">
<span class="t" id="tm">0:00 / 0:00</span>
<button class="pri" id="rb" disabled>রেন্ডার</button>
</div>
<div class="prog" id="prog"><i id="pb"></i></div>
<p id="msg">ভিডিও ফাইল বেছে নিন।</p>
<nav class="tabs" id="tabs"><button type="button">📁 ফাইল</button><button type="button">🎙 ভয়েস</button><button type="button">🎚 মিক্স</button><button type="button">💬 সাবটাইটেল</button><button type="button">✨ ইফেক্ট</button><button type="button">⚙ আউটপুট</button><i id="ind"></i></nav>
<div class="dock" id="dock"><div class="track" id="track"><section class="pane">
<label class="drop" id="d1"><b>ভিডিও</b><span id="n1">MP4, WebM, MOV</span><input type="file" id="f1" accept="video/*"></label>
<label class="drop" id="d2"><b>ভয়েস ওভার (ঐচ্ছিক)</b><span id="n2">MP3, WAV, M4A</span><input type="file" id="f2" accept="audio/*"></label>
<label class="drop" id="d3"><b>সাবটাইটেল SRT (ঐচ্ছিক)</b><span id="n3">.srt</span><input type="file" id="f3" accept=".srt,.txt"></label>
<textarea id="se" rows="5" placeholder="অথবা এখানে SRT পেস্ট বা এডিট করুন" style="width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.85rem;margin-bottom:10px"></textarea>
<label class="drop" id="d4"><b>ব্যাকগ্রাউন্ড মিউজিক (ঐচ্ছিক)</b><span id="n4">MP3, WAV</span><input type="file" id="f4" accept="audio/*"></label>
</section><section class="pane">
<div class="row"><label for="tt">ফোনের কণ্ঠে পড়ুন</label><input type="checkbox" id="tt" style="accent-color:var(--acc);width:20px;height:20px"></div>
<div class="row"><label for="vs">কণ্ঠ</label><select id="vs"></select></div>
<div class="row"><label for="tr">গতি</label><input type="range" id="tr" min="0.7" max="1.6" step="0.1" value="1"><output id="tro">1.0x</output></div>
<div class="row"><label for="tf">সময়ে ফিট করুন</label><input type="checkbox" id="tf" checked style="accent-color:var(--acc);width:20px;height:20px"></div>
<p class="t" id="tn"></p>
</section><section class="pane">
<div class="row"><label for="vv">ভিডিওর শব্দ</label><input type="range" id="vv" min="0" max="150" value="30"><output id="vvo">30%</output></div>
<div class="row"><label for="av">ভয়েস ওভার</label><input type="range" id="av" min="0" max="200" value="100"><output id="avo">100%</output></div>
<div class="row"><label for="bv">মিউজিকের শব্দ</label><input type="range" id="bv" min="0" max="100" value="20"><output id="bvo">20%</output></div>
<div class="row"><label for="so">SRT সময়ের শিফট (সে.)</label><input type="number" id="so" step="0.1" value="0"></div>
<div class="row"><label for="ao">ভয়েসের শিফট (সে.)</label><input type="number" id="ao" step="0.1" value="0"></div>
</section><section class="pane">
<div class="row"><label for="sz">আকার</label><input type="range" id="sz" min="2" max="12" step="0.5" value="5.5"><output id="szo">5.5%</output></div>
<div class="row"><label for="bt">নিচ থেকে দূরত্ব</label><input type="range" id="bt" min="2" max="40" value="8"><output id="bto">8%</output></div>
<div class="row" style="flex-wrap:wrap"><button type="button" data-p="classic">ক্লাসিক</button><button type="button" data-p="tiktok">টিকটক</button><button type="button" data-p="neon">নিওন</button><button type="button" data-p="minimal">মিনিমাল</button></div>
<div class="row"><label for="ff">ফন্ট</label><select id="ff"><option value="Noto Sans Bengali">Noto Sans Bengali</option><option value="Hind Siliguri">Hind Siliguri</option><option value="Tiro Bangla">Tiro Bangla (সেরিফ)</option><option value="Baloo Da 2">Baloo Da 2</option></select></div>
<div class="row"><label for="fd">ফেড অ্যানিমেশন</label><input type="checkbox" id="fd" checked style="accent-color:var(--acc);width:20px;height:20px"></div>
<div class="row"><label for="wm">ওয়াটারমার্ক</label><input type="text" id="wm" placeholder="চ্যানেলের নাম" style="flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit"><select id="wp" style="flex:0 0 72px"><option value="r">ডানে</option><option value="l">বামে</option></select></div>
<div class="row"><label for="fc">লেখার রং</label><input type="color" id="fc" value="#ffffff"><label for="bg" style="flex:0 0 auto">ব্যাকগ্রাউন্ড</label><input type="color" id="bg" value="#000000"></div>
<div class="row"><label for="ba">ব্যাকগ্রাউন্ড স্বচ্ছতা</label><input type="range" id="ba" min="0" max="100" value="55"><output id="bao">55%</output></div>
<div class="row"><label for="sp">সাবটাইটেলের অবস্থান</label><select id="sp"><option value="b">নিচে</option><option value="m">মাঝখানে</option><option value="t">উপরে</option></select></div>
</section><section class="pane">
<div class="row"><label for="cf">কালার ফিল্টার</label><select id="cf"><option value="n">কোনোটি নয়</option><option value="cine">সিনেমাটিক</option><option value="warm">উষ্ণ</option><option value="cool">ঠান্ডা</option><option value="bw">সাদা-কালো</option><option value="vivid">ভিভিড</option><option value="fade">ফেডেড</option></select></div>
<div class="row"><label for="cb">উজ্জ্বলতা</label><input type="range" id="cb" min="50" max="150" value="100"><output id="cbo">100%</output></div>
<div class="row"><label for="cc">কনট্রাস্ট</label><input type="range" id="cc" min="50" max="150" value="100"><output id="cco">100%</output></div>
<div class="row"><label for="kk">কারাওকে হাইলাইট</label><input type="checkbox" id="kk" style="accent-color:var(--acc);width:20px;height:20px"><input type="color" id="kc" value="#ffd400"></div>
<div class="row"><label for="ti">ইন্ট্রো টাইটেল</label><input type="text" id="ti" placeholder="শুরুর শিরোনাম" style="flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit"><select id="td" style="flex:0 0 72px"><option value="2">২ সে.</option><option value="3" selected>৩ সে.</option><option value="5">৫ সে.</option></select></div>
<div class="row"><label for="pg">প্রোগ্রেস বার</label><input type="checkbox" id="pg" style="accent-color:var(--acc);width:20px;height:20px"><input type="color" id="pc" value="#ff3b5c"></div>
<div class="row"><label for="dk">ভয়েসের সময় মিউজিক কমান</label><input type="checkbox" id="dk" checked style="accent-color:var(--acc);width:20px;height:20px"></div>
<div class="row"><label for="kb">জুম ইফেক্ট</label><select id="kb"><option value="n">নেই</option><option value="i">ধীরে জুম ইন</option><option value="o">ধীরে জুম আউট</option></select></div>
<div class="row"><label for="mr">আয়না (মিরর)</label><input type="checkbox" id="mr" style="accent-color:var(--acc);width:20px;height:20px"></div>
<div class="row"><label for="vg">ভিনিয়েট</label><input type="checkbox" id="vg" style="accent-color:var(--acc);width:20px;height:20px"></div>
<div class="row"><label for="lb">সিনেমাটিক বার</label><input type="checkbox" id="lb" style="accent-color:var(--acc);width:20px;height:20px"></div>
<div class="row"><label for="tw">টাইপরাইটার লেখা</label><input type="checkbox" id="tw" style="accent-color:var(--acc);width:20px;height:20px"></div>
<div class="row"><label for="f5">লোগো ছবি</label><input type="file" id="f5" accept="image/*" style="flex:1;min-width:0;font-size:.8rem"><select id="lp" style="flex:0 0 72px"><option value="r">ডানে</option><option value="l">বামে</option></select></div>
<div class="row"><label for="ls">লোগোর আকার</label><input type="range" id="ls" min="5" max="40" value="14"><output id="lso">14%</output></div>
<div class="row"><label for="ot">আউট্রো টেক্সট</label><input type="text" id="ot" placeholder="শেষের বার্তা, যেমন: সাবস্ক্রাইব করুন" style="flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit"></div>
<div class="row"><label for="ts">ট্রিম: শুরু – শেষ (সে.)</label><input type="number" id="ts" min="0" step="0.1" value="0"><input type="number" id="te" min="0" step="0.1" value="0" title="0 মানে শেষ পর্যন্ত"></div>
<div class="row"><label for="cp">অডিও কম্প্রেসর (ক্লিপিং রোধ)</label><input type="checkbox" id="cp" checked style="accent-color:var(--acc);width:20px;height:20px"></div>
</section><section class="pane">
<div class="row"><label for="ra">রেশিও</label><select id="ra"><option value="o">মূল ভিডিওর মতো</option><option value="9:16">9:16 (শর্টস/রিলস)</option><option value="16:9">16:9 (ইউটিউব)</option><option value="1:1">1:1 (স্কয়ার)</option></select></div>
<div class="row"><label for="rs">রেজোলিউশন</label><select id="rs"><option value="960">960 px (হালকা)</option><option value="1280">1280 px (HD)</option><option value="1920" selected>1920 px (Full HD)</option></select></div>
<div class="row"><label for="fr">ফ্রেম রেট</label><select id="fr"><option value="24">24 fps</option><option value="30" selected>30 fps</option><option value="60">60 fps</option></select></div>
<div class="row"><label for="af">অডিও ফেড ইন/আউট</label><input type="checkbox" id="af" checked style="accent-color:var(--acc);width:20px;height:20px"></div>
<div class="row"><label for="br">কোয়ালিটি</label><select id="br"><option value="4">ভালো (4 Mbps)</option><option value="8" selected>উচ্চ (8 Mbps)</option><option value="14">সর্বোচ্চ (14 Mbps)</option></select></div>

</section></div></div>
</div>
<div id="out"><div class="card"><h2>রেন্ডার সম্পন্ন</h2><video id="rv" controls playsinline></video><a class="dl" id="dl"><button class="pri" type="button">ভিডিও ডাউনলোড</button></a> <button type="button" id="oc">বন্ধ করুন</button></div></div>

<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),c=cv.getContext('2d'),v=document.createElement('video');
v.playsInline=true;v.preload='auto';
let ctx,dest,mon,mix,comp,vG,aG,bG,bbuf=null,bsrc=null,graph=false,vbuf=null,vsrc=null,cues=[],playing=false,rendering=false,W=640,H=360,hasV=false;
const val=id=>+$(id).value;
const fmt=s=>{s=Math.max(0,s||0);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')};
const say=t=>$('msg').textContent=t;

function setup(){
  if(graph)return;
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  dest=ctx.createMediaStreamDestination();
  mon=ctx.createGain();mon.connect(ctx.destination);
  mix=ctx.createGain();comp=ctx.createDynamicsCompressor();mix.connect(comp);comp.connect(dest);comp.connect(mon);
  vG=ctx.createGain();aG=ctx.createGain();bG=ctx.createGain();bG.connect(mix);
  ctx.createMediaElementSource(v).connect(vG);
  vG.connect(mix);aG.connect(mix);an=ctx.createAnalyser();an.fftSize=512;aG.connect(an);graph=true;gains();
}
function gains(){if(!graph)return;vG.gain.value=val('vv')/100;aG.gain.value=val('av')/100;bG.gain.value=val('bv')/100;comp.threshold.value=$('cp').checked?-10:0;comp.ratio.value=$('cp').checked?12:1}

/* SRT */
function parseSRT(t){
  const out=[];
  t=t.replace(/^\uFEFF/,'').replace(/\r/g,'').trim();
  const sec=(h,m,s,f)=>+h*3600+ +m*60+ +s+ +('0.'+f);
  for(const b of t.split(/\n{2,}/)){
    const L=b.split('\n');
    const i=L.findIndex(l=>l.includes('-->'));
    if(i<0)continue;
    const m=L[i].match(/(\d+):(\d+):(\d+)[,.](\d+)\s*-->\s*(\d+):(\d+):(\d+)[,.](\d+)/);
    if(!m)continue;
    const txt=L.slice(i+1).join('\n').replace(/<[^>]+>/g,'').replace(/\{[^}]*\}/g,'').trim();
    if(txt)out.push({s:sec(m[1],m[2],m[3],m[4]),e:sec(m[5],m[6],m[7],m[8]),t:txt});
  }
  return out.sort((a,b)=>a.s-b.s);
}

/* Drawing */
function wrap(txt,maxW){
  const res=[];
  for(const para of txt.split('\n')){
    let line='';
    for(const w of para.split(/\s+/)){
      const test=line?line+' '+w:w;
      if(c.measureText(test).width>maxW&&line){res.push(line);line=w}else line=test;
    }
    res.push(line);
  }
  return res;
}
function draw(){
  c.fillStyle='#000';c.fillRect(0,0,W,H);
  c.save();
  {const dd=((T1||v.duration||1)-T0)||1,p=Math.max(0,Math.min(1,(v.currentTime-T0)/dd)),kb=$('kb').value,z=kb==='i'?1+.12*p:kb==='o'?1.12-.12*p:1;c.translate(W/2,H/2);c.scale($('mr').checked?-z:z,z);c.translate(-W/2,-H/2)}
  c.filter=vf();
  if(hasV&&v.readyState>=2){
    const vw=v.videoWidth,vh=v.videoHeight;
    if($('ra').value==='o')c.drawImage(v,0,0,W,H);
    else{
      const cs=Math.max(W/vw,H/vh),sw=W/cs,sh=H/cs;

    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5)goTab(curTab+(dx<0?1:-1));
  },{passive:true});
  dk.addEventListener('scroll',()=>{dk.scrollLeft=0});
})();
window.addEventListener('resize',()=>goTab(curTab));
document.fonts.ready.then(()=>goTab(curTab));
$('oc').onclick=()=>{$('out').style.display='none'};
/* Android APK: save/share the rendered video */
$('dl').addEventListener('click',async e=>{
  const C=window.Capacitor;
  if(!(C&&C.isNativePlatform&&C.isNativePlatform()&&C.Plugins&&C.Plugins.Filesystem))return;
  e.preventDefault();
  try{
    say('ফাইল সেভ হচ্ছে…');
    const blob=await (await fetch($('dl').href)).blob();
    const b64=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(String(f.result).split(',')[1]);f.readAsDataURL(blob)});
    const name=$('dl').download||'rendered-video.webm';
    const res=await C.Plugins.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});
    await C.Plugins.Share.share({title:name,url:res.uri,dialogTitle:'ভিডিও সেভ বা শেয়ার করুন'});
    say('সেভ/শেয়ার মেনু খোলা হয়েছে।');
  }catch(err){say('সেভ করা যায়নি: '+(err&&err.message||err))}
});
goTab(0);
draw();
</script>
